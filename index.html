m(1,"<p><strong>La Création en six jours</strong> — D-ieu crée le monde : lumière, firmament, mers, astres, animaux, puis l'homme et la femme à Son image. Le septième jour, Il sanctifie le Chabbat.</p><p><strong>Le jardin d'Éden</strong> — Adam et Ève mangent le fruit défendu et sont exilés du paradis. D-ieu leur confectionne des habits de peau.</p><p><strong>Caïn et Abel</strong> — Caïn tue son frère par jalousie. La paracha se clôt sur la généalogie jusqu'à Noé et la corruption croissante de l'humanité.</p>","<p><strong>La lumière primordiale</strong> — Le Baal Shem Tov : la lumière du premier jour n'est pas celle du soleil (créé le 4e jour) mais la lumière de la Torah, cachée pour les justes dans le monde à venir. Chaque étude de Torah en ravive une étincelle.</p><p><strong>L'image divine</strong> — L'Admour HaZaken (Tanya ch.2) : l'homme porte une âme divine, « partie de D-ieu d'en haut ». Notre mission est de révéler cette étincelle dans chaque acte du quotidien — transformer la matière en sainteté.</p><p><strong>Le Chabbat comme but</strong> — Le Sfat Emet : le Chabbat n'est pas la fin mais le but de la semaine. Chaque action des six jours prend son sens à la lumière du septième.","Baal Shem Tov, Keter Shem Tov · Tanya ch.2 · Sfat Emet Bereshit 5631");

m(2,"<p><strong>Noé et le déluge</strong> — Noé, homme juste dans sa génération, construit une arche selon les instructions divines. Le déluge efface toute vie pendant quarante jours. Sa famille et les animaux survivent.</p><p><strong>L'alliance de l'arc-en-ciel</strong> — D-ieu conclut une alliance avec toute l'humanité : Il ne détruira plus la terre par les eaux. L'arc-en-ciel en est le signe éternel.</p><p><strong>La tour de Babel</strong> — Les hommes bâtissent une tour vers les cieux par orgueil. D-ieu confond leur langage et les disperse sur toute la terre. La paracha se clôt avec la généalogie menant à Abraham.","<p><strong>L'arche comme mot de Torah</strong> — תֵּבָה signifie à la fois « arche » et « mot ». Le Baal Shem Tov : quand le monde est submergé par le déluge des tentations, l'homme doit s'enfermer dans les mots de la Torah pour sauvegarder son âme.</p><p><strong>Juste dans sa génération</strong> — Le Sfat Emet : Noé est juste malgré son environnement corrompu. La sainteté est toujours possible quel que soit le contexte. Chaque génération a ses défis propres et son propre chemin vers D-ieu.</p><p><strong>L'arc-en-ciel et la promesse</strong> — La lumière blanche décomposée en sept couleurs est l'image des âmes d'Israël dispersées dans la galout. La promesse divine est leur réunification en une lumière unifiée aux temps messianiques.","Baal Shem Tov §68 · Sfat Emet Noach · Likoutei Sichos");

m(3,"<p><strong>L'appel divin — Lekh Lekha</strong> — D-ieu ordonne à Abraham de quitter sa terre, sa famille, la maison de son père. Il part à 75 ans avec Sara et Lot. C'est la première des dix épreuves d'Abraham.</p><p><strong>Les voyages et l'alliance</strong> — Abraham traverse Canaan, séjourne en Égypte, se sépare de Lot. D-ieu lui promet la terre et une descendance innombrable comme les étoiles. Il conclut l'alliance entre les morceaux (brit bein habetarim).</p><p><strong>La circoncision</strong> — À 99 ans, Abraham reçoit la brit mila et se circoncit lui-même. Son nom passe d'Abram à Abraham.","<p><strong>Va vers toi-même</strong> — « Lekh Lekha » signifie littéralement « va vers toi-même ». Le Baal Shem Tov : cet appel est avant tout intérieur — dépasser son moi superficiel pour atteindre son âme divine. Le vrai voyage d'Abraham est un voyage vers l'intérieur.</p><p><strong>Les trois obstacles spirituels</strong> — L'Admour HaZaken (Likoutei Torah) : quitter « ta terre » (habitudes corporelles), « ta patrie » (influences de l'éducation), « la maison de ton père » (limites de l'intellect). La liberté spirituelle exige de transcender ces trois enveloppes.</p><p><strong>Sois une bénédiction</strong> — Le Sfat Emet : celui qui accomplit son Lekh Lekha intérieur devient source de bénédiction pour tous. La sainteté personnelle rayonne nécessairement vers l'extérieur.","Baal Shem Tov §12 · Admour HaZaken, Likoutei Torah · Sfat Emet 5638");

m(4,"<p><strong>Les trois anges</strong> — Abraham, convalescent après sa circoncision, accueille trois anges déguisés en voyageurs avec une hospitalité exemplaire. Ils annoncent la naissance d'Isaac. Sara rit d'incrédulité.</p><p><strong>Sodome et l'intercession</strong> — D-ieu informe Abraham de la destruction de Sodome. Abraham intercède courageusement pour les justes. Les anges sauvent Lot. Sa femme se transforme en statue de sel.</p><p><strong>L'Akéda — la ligature d'Isaac</strong> — D-ieu éprouve Abraham en lui demandant d'offrir Isaac sur le mont Moriah. Au dernier moment un ange retient son bras. Un bélier est sacrifié à sa place. C'est la suprême épreuve.","<p><strong>L'hospitalité prime sur tout</strong> — Le Talmud (Chabbat 127a) : l'hospitalité est plus grande que recevoir la Présence divine. Abraham interrompt sa prophétie pour courir vers les voyageurs. Le Baal Shem Tov : l'amour de l'autre doit primer sur le repli spirituel, aussi élevé soit-il.</p><p><strong>L'Akéda et la prière</strong> — L'Admour HaZaken : l'Akéda est le fondement de toute prière juive. Nous prions avec le mérite d'Abraham qui accepta de tout sacrifier. Chaque son du Chofar à Roch Hachana rappelle le bélier d'Abraham.</p><p><strong>Les épreuves comme élévations</strong> — Le Sfat Emet : D-ieu n'a jamais voulu le sacrifice d'Isaac — Il voulait mesurer la profondeur de la foi. Chaque épreuve n'est pas une punition mais une invitation à gravir un échelon vers D-ieu.","Talmud Chabbat 127a · Torah Or Vayera · Sfat Emet 5644");

m(5,"<p><strong>La mort de Sara</strong> — Sara décède à 127 ans à Hébron. Abraham achète la caverne de Makhpéla aux Hittites — premier bien immobilier des patriarches en terre de Canaan.</p><p><strong>La mission d'Eliezer</strong> — Abraham envoie son serviteur chercher une femme pour Isaac. Eliezer prie D-ieu de le guider par un signe précis. Rébecca remplit le signe et accepte de partir.</p><p><strong>Le mariage d'Isaac et Rébecca</strong> — Isaac méditait dans les champs au coucher du soleil — origine de la prière de Mincha. Leur rencontre et leur mariage consolent Isaac du deuil de sa mère.","<p><strong>Les années de Sara inaltérables</strong> — À cent ans elle était comme à vingt, à vingt comme à sept. Le Sfat Emet : la véritable sainteté ne vieillit pas — l'âme divine reste toujours jeune et lumineuse, hors du temps.</p><p><strong>La prière d'Eliezer — la première spontanée</strong> — Le Baal Shem Tov : cette prière enseigne à voir les signes divins dans le quotidien. D-ieu répond avant même que nous ayons fini de prier — la réponse est déjà dans la demande sincère.</p><p><strong>Isaac méditait dans les champs</strong> — L'Admour HaZaken : chaque prière est une rencontre entre l'âme et sa Source divine — comme Isaac rencontrant Rébecca au coucher du soleil.","Rachi sur Gn 23:1 · Baal Shem Tov §56 · Sfat Emet 5636");

m(6,"<p><strong>Jacob et Ésaü</strong> — Des jumeaux se battent dans le ventre de Rébecca. D-ieu annonce : « deux nations sont en toi ». Ésaü naît le premier, rouge et velu. Jacob tient son talon.</p><p><strong>Le droit d'aînesse et les bénédictions</strong> — Ésaü vend son droit d'aînesse pour un plat de lentilles. Isaac vieillit. Jacob, déguisé sur les conseils de Rébecca, reçoit la bénédiction principale. Ésaü pleure amèrement.</p><p><strong>La fuite vers Haran</strong> — Jacob fuit la colère d'Ésaü. Isaac le bénit solennellement avant son départ en lui interdisant d'épouser une femme cananéenne.","<p><strong>Les deux nations — le combat intérieur</strong> — Le Sfat Emet : le combat des jumeaux représente le conflit permanent entre le yetzer hatov et le yetzer hara. Notre tâche est d'élever les étincelles de sainteté cachées même dans la force brute d'Ésaü.</p><p><strong>La spiritualité ne s'hérite pas</strong> — L'Admour HaZaken : Jacob comprend la valeur de la bekhorat qu'Ésaü méprise pour une soupe. La bekhorat ne peut pas être héritée — elle doit être désirée et conquise par l'effort.</p><p><strong>Le talon qui aspire au plus haut</strong> — יַעֲקֹב vient de עָקֵב (talon). Le Maharal : Jacob représente ce qui aspire au plus haut depuis le plus bas. C'est le secret de la guéoula — la délivrance vient de ceux qui paraissent les plus humbles.","Sfat Emet Toldot · Admour HaZaken · Maharal, Guevourot Hachem");

m(7,"<p><strong>L'échelle de Jacob</strong> — Jacob fuit vers Haran. La nuit, il rêve d'une échelle entre la terre et les cieux avec des anges qui montent et descendent. D-ieu lui renouvelle les promesses des patriarches.</p><p><strong>Jacob chez Laban</strong> — Il travaille sept ans pour Rachel mais Laban lui donne Léa. Il travaille encore sept ans pour Rachel. Douze fils naissent de ses quatre femmes.</p><p><strong>La fuite de chez Laban</strong> — Après vingt ans, Jacob part secrètement avec sa famille et ses troupeaux. Laban les poursuit mais D-ieu lui apparaît. Ils concluent un accord.","<p><strong>L'échelle et la Torah</strong> — סֻלָּם a la même valeur numérique que סִינַי. Le Zohar : l'échelle est l'image de la Torah — son pied dans la terre (les mitsvot pratiques), son sommet dans les cieux (les secrets mystiques).</p><p><strong>Les anges montent sur Jacob lui-même</strong> — Le Baal Shem Tov : les anges montent et descendent sur Jacob lui-même. Chaque âme juive est une échelle — parfois elle s'élève, parfois elle descend dans la matière pour en élever les étincelles.</p><p><strong>D-ieu est en ce lieu et je ne le savais pas</strong> — L'Admour HaZaken : c'est l'image de la galout. Nous ne réalisons pas toujours la sainteté du lieu où nous nous trouvons. Chaque endroit peut devenir « la porte des cieux ».","Zohar Vayetze 149b · Baal Shem Tov · Torah Or Vayetze");

m(8,"<p><strong>Le retour vers Ésaü</strong> — Jacob envoie des cadeaux à Ésaü qui vient avec 400 hommes. Jacob prie, divise son camp. La nuit, il reste seul et lutte avec un être mystérieux jusqu'à l'aube.</p><p><strong>Le combat avec l'ange</strong> — L'ange touche le nerf sciatique de Jacob. Jacob reçoit le nom Israël : « tu as lutté avec D-ieu et les hommes, et tu as vaincu ».</p><p><strong>La réconciliation avec Ésaü</strong> — La rencontre se passe bien. Jacob s'installe à Shechem puis à Béthel où il érige une stèle.","<p><strong>Le combat de l'âme d'Israël</strong> — Le Zohar : l'ange était le « sar » (prince céleste) d'Ésaü, la force spirituelle de l'exil occidental. Israël peut être blessé mais ne peut être vaincu que s'il lâche prise — et il ne lâche jamais.</p><p><strong>La marque de la lutte transforme</strong> — L'Admour HaZaken : Jacob sort boiteux mais victorieux. Celui qui a vraiment lutté avec D-ieu ne marche plus tout à fait comme avant — il est à jamais transformé par cette rencontre.</p><p><strong>Israël — la tête aspirant vers le haut</strong> — Le Sfat Emet : l'identité d'Israël se définit par l'aspiration vers le haut — même et surtout dans les moments de lutte et d'obscurité.","Zohar Vayishlach 170a · Admour HaZaken · Sfat Emet 5641");

m(9,"<p><strong>Joseph et la tunique</strong> — Jacob aime Joseph par-dessus tous et lui offre une tunique de couleurs. Les rêves prophétiques de Joseph attisent la jalousie de ses frères.</p><p><strong>La vente de Joseph</strong> — Les frères complotent. Joseph est jeté dans un puits puis vendu pour vingt pièces d'argent à des marchands. Jacob reçoit la tunique ensanglantée et pleure.</p><p><strong>Joseph en Égypte</strong> — Vendu à Potiphar, Joseph monte en grade. Accusé faussement, il est emprisonné. Il interprète les songes du panetier et de l'échanson.","<p><strong>La Providence cachée dans la vente</strong> — Le Baal Shem Tov : rien n'arrive par hasard. Même la jalousie des frères et la vente font partie du plan divin conduisant à la libération d'Égypte. La Providence divine guide chaque détail de l'histoire.</p><p><strong>Joseph — Sefirat Yessod</strong> — Joseph représente le fondement (יסוד), canal entre le ciel et la terre. Sa descente en Égypte est le prototype du Kiddouch Hachem dans l'exil — rester fidèle à D-ieu dans les profondeurs de la matière.</p><p><strong>Jacob voulait s'établir en paix</strong> — L'Admour HaZaken : les justes ne peuvent connaître le repos complet en ce monde — leur mission est d'élever des étincelles dans les profondeurs de l'exil.","Baal Shem Tov §207 · Torah Or Vayeshev · Zohar Vayeshev");

m(10,"<p><strong>Les songes de Pharaon</strong> — Sept vaches grasses dévorées par sept maigres ; sept épis pleins avalés par sept vides. Aucun sage ne les interprète. L'échanson se souvient de Joseph en prison.</p><p><strong>L'élévation de Joseph</strong> — Joseph interprète : sept années d'abondance puis sept de famine. Pharaon le nomme vice-roi d'Égypte à trente ans. Joseph administre l'Égypte avec sagesse.</p><p><strong>Les frères en Égypte</strong> — La famine frappe tout le Proche-Orient. Les frères de Joseph viennent acheter du grain. Joseph les reconnaît mais ne se révèle pas. Il retient Siméon en otage.","<p><strong>Deux ans d'attente supplémentaires</strong> — Joseph avait cherché une aide humaine (l'échanson). Le Sfat Emet : quand on cherche d'abord l'aide humaine avant l'aide divine, la délivrance est retardée. Le bitahon doit être la force première.</p><p><strong>Révélateur de mystères divins</strong> — L'Admour HaZaken : Joseph incarne la capacité de voir la Providence divine cachée derrière les apparences du monde naturel. Les vaches grasses et maigres sont l'image du rythme de l'histoire.</p><p><strong>Joseph et la téchouva des frères</strong> — Joseph se présente comme un étranger menaçant pour que ses frères fassent téchouva. Le Maharal : le vrai pardon ne peut venir qu'après la prise de conscience totale de la faute commise.","Sfat Emet Miketz · Torah Or Miketz · Maharal");

m(11,"<p><strong>Juda s'avance</strong> — Joseph cache la coupe dans le sac de Benjamin. Juda plaide avec une éloquence bouleversante, offrant de rester esclave à la place de son frère Benjamin.</p><p><strong>Les retrouvailles</strong> — Joseph ne peut plus se retenir et révèle son identité en pleurant : « Je suis Joseph ! Mon père vit-il encore ? » Les frères sont stupéfaits. Ils se réconcilient.</p><p><strong>La descente en Égypte</strong> — Joseph invite toute la famille à s'installer à Goshen. Jacob apprend que son fils vit. 70 âmes descendent en Égypte.","<p><strong>Juda — modèle de téchouva parfaite</strong> — L'Admour HaZaken : Juda avait proposé de vendre Joseph — maintenant il offre sa propre liberté pour Benjamin. C'est le modèle de la téchouva qui transforme le passé en force positive.</p><p><strong>Je suis Joseph — la révélation finale</strong> — Le Baal Shem Tov : au moment de la révélation, tout s'éclaire. Les épreuves, la jalousie, la vente — tout avait un sens. C'est ainsi que sera la guéoula : soudaine, totale, la Providence divine se révèle derrière toute l'histoire.</p><p><strong>Soixante-dix âmes — soixante-dix nations</strong> — Le Sfat Emet : les 70 âmes qui descendent correspondent aux 70 nations du monde. La mission d'Israël est de porter la lumière divine dans toutes les strates de l'humanité.","Admour HaZaken, Likoutei Torah · Baal Shem Tov §310 · Sfat Emet 5645");

m(12,"<p><strong>Les bénédictions de Jacob</strong> — Jacob bénit les fils de Joseph en croisant les mains, donnant la préséance au cadet Ephraïm sur Manassé. Il bénit ensuite chacun de ses douze fils avec une prophétie personnelle.</p><p><strong>La mort de Jacob</strong> — Jacob demande à être enterré dans la caverne de Makhpéla. Il meurt à 147 ans. Un grand deuil est observé. Joseph et ses frères l'enterrent en Canaan.</p><p><strong>La mort de Joseph</strong> — Joseph rassure ses frères qu'il ne se vengera pas : « Vous aviez voulu me faire du mal, D-ieu l'a voulu pour le bien. » Il meurt à 110 ans.","<p><strong>Les mains croisées — contre l'ordre naturel</strong> — L'Admour HaZaken : la Torah renverse constamment l'ordre naturel. La grandeur spirituelle ne s'hérite pas — elle se mérite par l'effort et la dévotion personnelle.</p><p><strong>D-ieu a voulu pour le bien</strong> — Le Baal Shem Tov : la phrase la plus profonde de la Genèse. Derrière chaque épreuve, une volonté divine bienveillante. Voir D-ieu dans la totalité de l'histoire — voilà la foi d'Israël.</p><p><strong>Le cercueil en Égypte</strong> — Le Sfat Emet : la Genèse se clôt sur « un cercueil en Égypte ». La promesse que l'histoire n'est pas finie. Le cercueil de Joseph porté dans le désert rappellera à chaque génération la délivrance à venir.","Torah Or Vayechi · Baal Shem Tov §88 · Sfat Emet 5650");

m(13,"<p><strong>L'oppression en Égypte</strong> — Un nouveau Pharaon asservit les Hébreux. Plus ils sont opprimés, plus ils se multiplient. Pharaon ordonne de jeter les nouveau-nés mâles dans le Nil.</p><p><strong>La naissance et la vocation de Moïse</strong> — Moïse naît, est sauvé par la fille de Pharaon. Il grandit au palais. Il tue un Égyptien qui frappait un Hébreu et fuit à Midian où il épouse Tsipora.</p><p><strong>Le buisson ardent</strong> — D-ieu apparaît à Moïse dans un buisson qui brûle sans se consumer. Il révèle Son Nom : « Je suis qui Je serai ». Moïse est envoyé libérer Israël. Aaron est désigné comme porte-parole.","<p><strong>Le buisson ardent et l'humilité</strong> — D-ieu se révèle dans le plus humble des arbrisseaux. Le Baal Shem Tov : la Présence divine réside là où règne l'humilité. Plus on s'abaisse devant D-ieu, plus on est capable de recevoir la révélation.</p><p><strong>Ehyé asher Ehyé — l'être pur</strong> — L'Admour HaZaken (Tanya) : ce Nom exprime l'être pur et absolu de D-ieu, au-delà de toute définition. La Torah nous révèle non ce qu'est D-ieu — car Il est indéfinissable — mais comment Il se relie à nous.</p><p><strong>Le feu qui ne consume pas</strong> — Le Sfat Emet : le peuple d'Israël est comme ce buisson — même dans les flammes de l'exil, il ne se consume pas. La présence divine en lui le préserve de la destruction totale.","Baal Shem Tov · Tanya ch.4 · Sfat Emet Shemot 5634");

m(14,"<p><strong>Les six premières plaies</strong> — D-ieu envoie sur l'Égypte : le sang, les grenouilles, les poux, les bêtes sauvages, la mort du bétail, les furoncles. Pharaon endurcit son cœur après chaque plaie.</p><p><strong>Le message de la délivrance</strong> — D-ieu dit à Moïse : « Je suis D-ieu, je vous tirerai de sous les fardeaux d'Égypte. » Les six termes de la délivrance fondent les six coupes du Séder de Pessa'h.</p><p><strong>La résistance de Pharaon</strong> — D-ieu endurcit progressivement le cœur de Pharaon pour que la gloire divine soit pleinement révélée à travers les plaies.","<p><strong>D-ieu endurcit le cœur — la liberté préservée</strong> — L'Admour HaZaken (Tanya, Iggeret HaTéchouva) : Pharaon avait péché librement les premières fois. D-ieu lui retire ensuite la possibilité de téchouva pour que la délivrance soit totale et révèle la gloire divine au monde entier.</p><p><strong>Les plaies comme purification cosmique</strong> — Le Sfat Emet : les dix plaies correspondent aux dix paroles de la Création. L'Égypte est purifiée progressivement de chaque sphère d'impureté pour préparer la sortie du peuple saint.</p><p><strong>Ani Hachem — Je suis D-ieu</strong> — Le Baal Shem Tov : D-ieu est présent dans chaque situation, même la plus obscure. Même dans la plus profonde servitude, la présence divine n'abandonne jamais Israël.","Tanya, Iggeret HaTéchouva · Sfat Emet Va'era · Baal Shem Tov");

m(15,"<p><strong>Les trois dernières plaies</strong> — Les sauterelles, les ténèbres épaisses pendant trois jours, et la mort des premiers-nés. Après la dixième plaie, Pharaon renvoie le peuple dans la nuit.</p><p><strong>La Pâque en Égypte</strong> — Institution du sacrifice pascal : agneau sans défaut, sang sur les linteaux, repas mangé en hâte. Le mois de Nissan devient le premier mois. Les lois du Pessa'h et des premiers-nés sont instituées.</p><p><strong>La sortie d'Égypte</strong> — Six cent mille hommes sortent avec une multitude mêlée et des troupeaux. L'Égypte est ravagée. La Torah prescrit les lois du Pessa'h pour les générations futures.","<p><strong>Les ténèbres — la lumière intérieure</strong> — Les Hébreux avaient de la lumière dans leurs demeures. Le Baal Shem Tov : même dans l'obscurité la plus totale, la lumière divine brille pour ceux qui la cherchent. L'exil est une obscurité extérieure — la lumière intérieure reste toujours accessible.</p><p><strong>L'agneau pascal — surmonter la peur</strong> — L'agneau était le dieu égyptien. Le sacrifice exigeait un courage immense. L'Admour HaZaken : la sortie d'Égypte commence par la victoire sur la peur du regard de l'autre — l'intériorisation de la foi avant la liberté extérieure.</p><p><strong>Mitsraïm — l'étroitesse intérieure</strong> — Le Sfat Emet : מִצְרַיִם vient de מֵצַר (étroitesse). Chaque homme a son Mitsraïm intérieur — ses limites, ses peurs, ses habitudes. Pessa'h est une invitation annuelle à en sortir.","Baal Shem Tov · Torah Or Bo · Sfat Emet Bo");

m(16,"<p><strong>La traversée de la mer Rouge</strong> — Les Hébreux se retrouvent coincés entre la mer et l'armée de Pharaon. Moïse lève son bâton, la mer se fend. Les Hébreux passent à pied sec. L'armée égyptienne est engloutie.</p><p><strong>Le cantique de la mer — Az Yachir</strong> — Moïse et tout Israël chantent l'un des plus beaux poèmes de la Torah. Myriam conduit les femmes avec des tambourins.</p><p><strong>Les premières épreuves du désert</strong> — L'eau amère de Mara est adoucie. La manne commence à tomber. D-ieu prescrit le Chabbat. Amalek attaque et est vaincu par Josué grâce aux mains levées de Moïse.","<p><strong>Nachshon et le premier pas de foi</strong> — La mer ne s'est pas ouverte quand Moïse a levé son bâton, mais quand Nachshon est entré dans l'eau jusqu'au cou. Le Baal Shem Tov : les miracles attendent l'initiative humaine. D-ieu ne s'ouvre que quand l'homme fait le premier pas.</p><p><strong>La manne et la confiance quotidienne</strong> — L'Admour HaZaken : la manne enseignait le bitahon quotidien. Vivre dans le présent, sans s'inquiéter du lendemain — la Providence divine pourvoit à chaque jour pour qui Lui fait confiance.</p><p><strong>Az Yachir — le passé au futur</strong> — Le Sfat Emet : la Torah utilise un temps ambigu — « alors Moïse chantera ». Le cantique de la mer est si profond qu'il sera chanté à nouveau aux temps messianiques — il transcende le temps.","Baal Shem Tov · Torah Or Beshalach · Sfat Emet 5638");

m(17,"<p><strong>Yitro et la délégation du pouvoir</strong> — Yitro, beau-père de Moïse, entend tout ce que D-ieu a fait pour Israël. Il rejoint le camp et conseille à Moïse d'instituer des juges pour alléger sa charge.</p><p><strong>La préparation au don de la Torah</strong> — D-ieu demande au peuple de se sanctifier pendant trois jours avant la révélation. Tonnerre, éclairs, nuage épais et son du Chofar sur le Sinaï. Le peuple tremble de crainte et de ferveur.</p><p><strong>Les Dix Commandements</strong> — D-ieu prononce les Dix Paroles devant tout le peuple d'Israël assemblé au pied du Sinaï. C'est le moment central de la révélation divine dans l'histoire humaine.","<p><strong>Yitro — le premier prosélyte</strong> — Yitro vient librement vers D-ieu après avoir « entendu ». Le Baal Shem Tov : la conversion sincère de Yitro enseigne que chaque âme humaine peut trouver le chemin vers D-ieu. La porte de la téchouva est toujours ouverte.</p><p><strong>Anokhi Hachem — Je suis D-ieu</strong> — L'Admour HaZaken (Tanya) : le mot אָנֹכִי vient de l'égyptien signifiant « moi-même ». D-ieu dit : c'est Ma propre essence — non Mes attributs ou Mes actions — qui s'est révélée au Sinaï. Révélation sans précédent dans l'histoire.</p><p><strong>Le Chofar et l'Infini</strong> — Le son du Chofar au Sinaï était le son de l'Infini se manifestant dans le fini. Le Sfat Emet : chaque Roch Hachana, ce son se répète — une invitation à retrouver l'intensité du Sinaï.","Baal Shem Tov · Tanya ch.36 · Sfat Emet Yitro 5639");

m(18,"<p><strong>Les lois civiles et sociales</strong> — La Torah détaille les lois sur l'esclavage hébreu, les atteintes à la personne, les dommages corporels, les responsabilités des gardiens et les relations sociales fondamentales.</p><p><strong>Lois économiques et éthiques</strong> — Protection de l'étranger, de la veuve et de l'orphelin. Interdiction du prêt à intérêt. Les trois fêtes de pèlerinage. Interdiction de faire bouillir un chevreau dans le lait de sa mère.</p><p><strong>L'alliance au Sinaï</strong> — Moïse écrit le Livre de l'Alliance. Le peuple répond : « Naaseh venishma — nous ferons et nous écouterons. » Moïse monte sur la montagne pour 40 jours.","<p><strong>Naaseh venishma — le paradoxe d'Israël</strong> — « Nous ferons et nous écouterons » : d'abord l'action, ensuite la compréhension. Le Baal Shem Tov : on comprend en faisant, pas avant. La foi précède la raison — c'est le secret du service divin d'Israël.</p><p><strong>La loi civile comme loi divine</strong> — L'Admour HaZaken : les Mishpatim (lois civiles) font suite immédiatement aux Dix Commandements pour enseigner que le droit humain est sacré. Léser son prochain est léser D-ieu lui-même.</p><p><strong>L'étranger — test ultime de la spiritualité</strong> — Le Sfat Emet : la Torah mentionne 36 fois l'obligation d'aimer l'étranger. Le traitement de celui qui est différent est le test ultime de la spiritualité. L'amour de D-ieu se mesure à l'amour de l'autre.","Baal Shem Tov · Torah Or Mishpatim · Sfat Emet 5642");

m(19,"<p><strong>Les contributions pour le Tabernacle</strong> — D-ieu demande à chaque Israélite de donner volontairement pour construire le Tabernacle. Les matériaux : or, argent, cuivre, tissus de couleurs, bois d'acacia, huile, épices.</p><p><strong>Les objets du Tabernacle</strong> — Plans détaillés de l'Arche d'Alliance, de la Table des pains de proposition, du Candélabre d'or (Menora), des rideaux et des planches, de l'Autel des holocaustes.</p><p><strong>Le Tabernacle — demeure divine</strong> — Le Tabernacle est la continuation du Sinaï. D-ieu souhaitant résider en permanence au milieu d'Israël. « Ils me feront un sanctuaire et Je résiderai en leur sein. »","<p><strong>La teruma du cœur</strong> — La contribution doit venir de « tout homme dont le cœur est généreux ». Le Baal Shem Tov : D-ieu n'a pas besoin de l'or et de l'argent — Il demande le cœur. La qualité de l'intention transforme le matériel en sainteté.</p><p><strong>Un sanctuaire dans chaque cœur</strong> — L'Admour HaZaken : « Et Je résiderai en leur sein » — en eux, dans chaque cœur humain, pas seulement dans l'édifice. Chaque Juif est un Tabernacle ambulant pour la Présence divine.</p><p><strong>La Menora et les sept niveaux de sagesse</strong> — Le Sfat Emet : la Menora représente la sagesse de la Torah. Ses sept branches symbolisent les sept niveaux de compréhension. Elle brûle de la nuit vers le matin — la Torah éclaire les ténèbres pour révéler la lumière.","Baal Shem Tov · Torah Or Teruma · Sfat Emet 5635");

m(20,"<p><strong>L'huile et les lampes</strong> — Aaron est chargé d'allumer les lampes de la Menora chaque jour. C'est la mitsva de l'allumage perpétuel — la flamme ne doit jamais s'éteindre.</p><p><strong>Les huit vêtements sacerdotaux</strong> — Plans détaillés du pectoral, de l'éphod, du manteau bleu, de la tunique, de la tiare et du diadème d'or gravé « Saint pour D-ieu ». Ces vêtements transforment Aaron en Grand Prêtre.</p><p><strong>L'Autel des parfums</strong> — Construction de l'Autel des parfums en or pur. Aaron offrira l'encens chaque matin et chaque soir — symbole de la prière montant vers les cieux.","<p><strong>Moïse absent de cette paracha</strong> — C'est la seule paracha depuis Shemot où le nom de Moïse n'apparaît pas. Il avait dit « efface-moi du Livre ». Le Baal Shem Tov : même absent par son nom, Moïse est présent dans chaque lettre — l'âme du juste est présente même quand elle semble absente.</p><p><strong>Les vêtements qui transforment</strong> — L'Admour HaZaken : les huit vêtements correspondent aux huit aspects de l'âme. S'habiller pour le service divin est un acte de transformation intérieure — on s'habille en saint pour devenir saint.</p><p><strong>L'encens et la prière la plus haute</strong> — Le Sfat Emet : l'encens (ketoret) monte sans retour — image de la prière pure. Son parfum pénètre là où les sacrifices n'accèdent pas. La prière sincère atteint les sphères les plus élevées.","Baal Shem Tov · Admour HaZaken · Sfat Emet Tetzaveh");

m(21,"<p><strong>Le demi-shekel</strong> — Chaque Israélite donne un demi-shekel comme rançon de son âme lors du recensement. Le riche ne donne pas plus, le pauvre pas moins — tous égaux devant D-ieu.</p><p><strong>Le veau d'or</strong> — Pendant l'absence de Moïse, le peuple construit un veau d'or. D-ieu veut détruire le peuple. Moïse intercède, brise les Tables, détruit le veau et punit les coupables.</p><p><strong>Le renouveau de l'alliance</strong> — D-ieu révèle à Moïse les Treize Attributs de Miséricorde. Moïse redescend avec les secondes Tables. Son visage rayonne d'un éclat si intense qu'il doit porter un voile.","<p><strong>Les Treize Attributs — le remède avant la maladie</strong> — Le Baal Shem Tov : D-ieu a préparé les attributs de miséricorde avant même la faute du veau d'or. D-ieu sait que l'homme faillira et prépare déjà le pardon — c'est Sa miséricorde infinie.</p><p><strong>Les secondes Tables plus précieuses</strong> — L'Admour HaZaken : les secondes Tables, fruit de la téchouva, sont plus précieuses que les premières. Là où arrivent les ba'alei téchouva (repentants), même les justes parfaits ne peuvent atteindre.</p><p><strong>Le demi-shekel</strong> — Le Sfat Emet : chacun donne un demi seulement. L'homme seul est incomplet. L'union avec D-ieu et avec la communauté d'Israël complète l'être humain.","Baal Shem Tov · Iggeret HaTéchouva · Sfat Emet Ki Tissa");

m(22,"<p><strong>Le Chabbat avant la construction</strong> — Moïse rappelle d'abord l'obligation du Chabbat — même pour construire le saint Tabernacle, on ne travaille pas le septième jour.</p><p><strong>Les dons affleurent</strong> — Le peuple donne avec une telle générosité que les artisans demandent à Moïse d'arrêter les contributions. Betsalel et Oholiav dirigent les travaux.</p><p><strong>La construction complète</strong> — Construction de tous les éléments : rideaux, planches, Arche, Table, Menora, autels. Tout est fait exactement selon les instructions divines.","<p><strong>Le Chabbat — tabernacle dans le temps</strong> — D-ieu mentionne le Chabbat avant la construction pour enseigner que la sainteté du temps précède la sainteté de l'espace. Le Baal Shem Tov : le Chabbat est le Tabernacle dans le temps — construit non avec des mains mais avec l'âme.</p><p><strong>La générosité comme signe de réparation</strong> — L'Admour HaZaken : le peuple donne trop — il faut arrêter. C'est le signe que la faute du veau d'or est réparée. L'âme juive purifiée retrouve naturellement sa générosité envers le divin.</p><p><strong>Betsalel — dans l'ombre de D-ieu</strong> — Le Sfat Emet : בְּצַלְאֵל signifie « dans l'ombre de D-ieu ». L'artisan qui construit le lieu saint travaille dans l'ombre de D-ieu — ses mains sont guidées d'en haut. Tout art véritable est un canal de créativité divine.","Baal Shem Tov · Admour HaZaken, Likoutei Torah · Sfat Emet");

m(23,"<p><strong>Le bilan de la construction</strong> — Moïse recense tous les matériaux utilisés : l'argent du demi-shekel sert aux socles de l'édifice, le cuivre aux crochets et aux bases de l'enceinte.</p><p><strong>Les vêtements sacerdotaux terminés</strong> — Les vêtements d'Aaron et de ses fils sont confectionnés avec soin, exactement selon les instructions divines. Moïse constate la conformité parfaite de tous les travaux.</p><p><strong>La Présence divine s'installe</strong> — Quand tout est terminé et béni par Moïse, la nuée recouvre le Tabernacle et la gloire de D-ieu le remplit entièrement. Même Moïse ne peut y entrer. La nuée guidera le peuple dans ses déplacements.","<p><strong>Ka'asher tsiva Hachem — dix-huit fois</strong> — Cette formule se répète 18 fois dans Pekudei. Le Baal Shem Tov : même un acte répété peut être fait avec une intention nouvelle chaque fois. La routine spirituelle n'est pas un obstacle — c'est une opportunité de renouvellement perpétuel.</p><p><strong>La nuée et le tsimtsum divin</strong> — L'Admour HaZaken : la nuée qui remplit le Tabernacle est la même nuée du Sinaï. D-ieu se « contracte » (tsimtsum) pour résider dans un espace limité — c'est le miracle central du Tabernacle et de chaque âme humaine qui L'accueille.</p><p><strong>La transparence du leader</strong> — Le Sfat Emet : Moïse rend compte de chaque demi-shekel au peuple. Les leaders d'Israël doivent rendre des comptes. La transparence et l'intégrité dans la gestion des biens sacrés sont une obligation absolue.","Baal Shem Tov · Torah Or Pekudei · Sfat Emet");

m(24,"<p><strong>Les sacrifices d'holocauste</strong> — D-ieu appelle Moïse du Tabernacle et lui enseigne les lois des sacrifices. L'olah (holocauste) est entièrement consumée sur l'autel. Les espèces animales et végétales sont précisées.</p><p><strong>Les sacrifices de paix, de péché et de culpabilité</strong> — La shlamim (paix) est partiellement consommée par les prêtres. Le hatat (péché) et l'acham (culpabilité) exigent la confession. La repentance est au cœur du système sacrificiel.</p><p><strong>L'impureté et ses conséquences</strong> — Les lois d'impureté transmise par contact et les obligations de purification qui en découlent.","<p><strong>Le aleph minuscule — humilité de Moïse</strong> — Le mot « vayikra » est écrit avec un aleph minuscule, signe d'humilité de Moïse. Le Baal Shem Tov : le plus grand prophète s'humiliait davantage que tous. Plus on approche du divin, plus on prend conscience de sa petitesse.</p><p><strong>Les sacrifices — rapprochement vers D-ieu</strong> — L'Admour HaZaken : קָרְבָּן (sacrifice) vient de קָרוֹב (proche). Chaque sacrifice est un mouvement de l'âme vers D-ieu. En l'absence du Temple, la prière remplace les sacrifices — mais l'intention de rapprochement reste identique.</p><p><strong>Adam ki yakriv — l'humilité de la terre</strong> — Le Sfat Emet : adam vient d'adamah (terre). L'humilité — se reconnaître comme poussière et cendre — est la condition première du service divin authentique.","Baal Shem Tov · Admour HaZaken, Likoutei Torah Vayikra · Sfat Emet");

m(25,"<p><strong>Le feu perpétuel sur l'autel</strong> — L'holocauste brûle toute la nuit sur l'autel. Les cendres sont enlevées le matin dans un rituel précis. La flamme de l'autel ne doit jamais s'éteindre — mitsva permanente.</p><p><strong>Les offrandes alimentaires</strong> — La mincha (offrande végétale) est préparée avec huile, sel et sans levain. Une partie est consumée sur l'autel, le reste revient aux cohanim.</p><p><strong>Les sacrifices de paix et de péché des cohanim</strong> — Lois détaillées pour le sacrifice de paix, pour le sacrifice de péché du Cohen Gadol et de toute l'assemblée d'Israël.","<p><strong>La flamme perpétuelle dans le cœur</strong> — « Ech tamid toukad — un feu perpétuel brûlera. » Le Baal Shem Tov : ce feu est l'image de l'amour divin qui doit brûler perpetuellement dans le cœur de l'homme. Même quand la flamme semble s'affaiblir, il faut l'entretenir chaque jour.</p><p><strong>Tsav — l'urgence du service divin</strong> — Le mot tsav exprime l'urgence et l'ardeur. L'Admour HaZaken : le service de D-ieu exige une zrizout (ardeur) constante — ne jamais se laisser envahir par la tiédeur spirituelle qui est l'ennemi de la sainteté.</p><p><strong>La cendre — l'humilité après la sublimation</strong> — Le Sfat Emet : même l'humble tâche d'enlever les cendres de l'autel est un service divin noble. Il n'y a pas de petit acte dans le service de D-ieu — chaque geste, même le plus simple, peut être accompli avec une intention sainte.","Baal Shem Tov · Admour HaZaken, Tanya ch.1 · Sfat Emet Tzav");

m(26,"<p><strong>L'inauguration du Tabernacle</strong> — Aaron et ses fils sont consacrés pendant sept jours. Le huitième jour, Aaron offre les premiers sacrifices officiels. La gloire divine apparaît et un feu divin consume les offrandes — signe d'agrément divin.</p><p><strong>La mort de Nadav et Avihou</strong> — Les deux fils aînés d'Aaron offrent un « feu étranger » et meurent aussitôt. Aaron accepte le décret divin en silence. Moïse interdit à Aaron de pleurer publiquement.</p><p><strong>Les lois de la cacherout</strong> — D-ieu enseigne les animaux permis (ruminants à sabots fendus, poissons avec nageoires et écailles) et interdits. Les insectes, reptiles et animaux rampants sont tous interdits.","<p><strong>Le huitième jour — transcender la nature</strong> — Le Sfat Emet : les sept jours de consécration représentent le cycle naturel. Le huitième jour le transcende — c'est le moment où la Présence divine descend spontanément. Le service humain parfait ouvre la porte au divin.</p><p><strong>Nadav et Avihou — une mort par excès d'amour</strong> — Le Zohar : ils moururent d'un excès d'amour divin — leur âme fut attirée vers le haut et ne put revenir. Le Baal Shem Tov : même une mort sainte laisse un vide. Le service divin doit rester ancré dans ce monde.</p><p><strong>La cacherout et la sensibilité de l'âme</strong> — L'Admour HaZaken : ce que l'homme mange influence son âme. La cacherout n'est pas hygiénique mais spirituelle — elle modèle la sensibilité de l'âme à travers le corps qu'elle habite.","Sfat Emet Shemini · Zohar · Admour HaZaken, Tanya ch.7");

m(27,"<p><strong>Tazria — Naissance et pureté</strong> — Après l'accouchement : 7 jours d'impureté puis 33 jours de purification pour un garçon ; 14 jours puis 66 jours pour une fille. Au terme, un agneau et un pigeon au Temple — ou deux pigeons si on est dans le besoin. La Torah adapte ses exigences aux capacités de chacun.</p><p><strong>Tazria — Le tsaraat de la peau</strong> — Affliction spirituelle se manifestant sous trois formes sur la peau. Seul le cohen l'examine et prononce le verdict. En cas de doute, isolement de 7 jours puis réexamen. La personne impure déchire ses vêtements et vit seule hors du camp.</p><p><strong>Metzora — Purification et réintégration</strong> — Rituel des deux oiseaux, cèdre, fil écarlate, hysope. L'oiseau libéré sur les champs — image de l'âme purifiée retrouvant sa liberté. La paracha se clôt sur les flux d'impureté et l'immersion au mikvé.","<p><strong>La parole qui crée ou détruit</strong> — Le Talmud (Erkhin 16a) : la cause principale du tsaraat est la lachon hara, la médisance. Le Baal Shem Tov : chaque parole crée des mondes ou en détruit — « La vie et la mort sont au pouvoir de la langue » (Proverbes 18:21).</p><p><strong>L'isolement comme espace sacré</strong> — L'Admour HaZaken (Tanya, Iggeret HaTéchouva ch.1) : l'isolement n'est pas une honte — c'est une retraite spirituelle. Seul avec lui-même, sans les distractions du monde, l'homme peut entendre la voix divine et opérer un retour sincère.</p><p><strong>Le huitième jour — transcender la nature</strong> — Le Sfat Emet (Tazria 5643) : les sept jours représentent le cycle naturel. Le huitième jour — la brit mila — transcende la nature, l'alliance éternelle. Le tsaraat survient quand l'homme reste prisonnier du cycle naturel sans aspirer au-delà.","Talmud Erkhin 16a · Tanya Iggeret HaTéchouva ch.1 · Sfat Emet Tazria 5643 · Proverbes 18:21");

m(29,"<p><strong>Acharei Mot — Le service de Yom Kippour</strong> — Description détaillée du service du Cohen Gadol : deux boucs (un pour D-ieu, un pour Azazel), bain rituel, habits blancs, encens dans le Saint des Saints. C'est le seul jour où le Grand Prêtre entre dans le lieu le plus sacré.</p><p><strong>Kedoshim — Soyez saints</strong> — Le grand code éthique d'Israël : honorer ses parents, observer le Chabbat, ne pas voler ni mentir, ne pas haïr son frère dans son cœur. Le commandement central : « Tu aimeras ton prochain comme toi-même. »</p><p><strong>Les lois de pureté familiale et sociale</strong> — Interdictions des unions illicites, des relations idolâtres, des pratiques cananéennes. Interdiction du sang. Les animaux sauvages chassés.","<p><strong>Le Saint des Saints et l'intimité divine</strong> — Le Cohen Gadol entre seul, sans aucun témoin humain. Le Baal Shem Tov : le rapport le plus intime avec D-ieu est personnel et silencieux. La vraie prière de Yom Kippour se fait dans le secret absolu du cœur.</p><p><strong>Ve'ahavta lere'akha kamokha</strong> — Le Baal Shem Tov fit de ce commandement le fondement de tout son enseignement. L'amour du prochain est la porte vers l'amour de D-ieu — on ne peut aimer D-ieu qu'à travers l'amour sincère de Ses créatures.</p><p><strong>Kedochim tihyu — un mouvement perpétuel</strong> — L'Admour HaZaken : la sainteté n'est pas un état acquis mais un mouvement perpétuel. « Soyez saints » est au présent continu — une aspiration constante, jamais définitivement accomplie.","Baal Shem Tov · Admour HaZaken, Tanya ch.32 · Sfat Emet Kedoshim");

m(31,"<p><strong>La sainteté des cohanim</strong> — Les prêtres sont soumis à des règles de pureté strictes : interdiction de se souiller au contact des morts (sauf parents proches), interdiction d'épouser certaines femmes, obligation de sainteté particulière pour le Cohen Gadol.</p><p><strong>Le calendrier des fêtes</strong> — Calendrier sacré complet : Chabbat, Pessa'h, Chavouot, Roch Hachana, Yom Kippour, Souccot, Chemini Atseret. Les lois du compte du omer entre Pessa'h et Chavouot.</p><p><strong>Le pain de proposition et le blasphémateur</strong> — Les lois du lechem hapanim (pain de proposition). Un épisode de blasphème. Lois du talion. Ces lois encadrent les responsabilités civiles et les droits fondamentaux.","<p><strong>Le cohen peut se souiller pour ses parents</strong> — Même la sainteté la plus élevée a ses limites humaines. Le Baal Shem Tov : D-ieu veut des êtres humains saints — pas des anges. Le deuil est une mitsva, non une imperfection.</p><p><strong>Le calendrier — tabernacle du temps</strong> — L'Admour HaZaken : le calendrier juif est le « Tabernacle du temps ». Chaque fête est un portail temporel — la même énergie cosmique revient chaque année. Nous ne commémorons pas des événements passés, nous les vivons à nouveau.</p><p><strong>Le omer et l'élévation quotidienne</strong> — Le Sfat Emet : les 49 jours du omer correspondent aux 49 portes de la sagesse. Chaque jour est une invitation à travailler sur une qualité de l'âme, pour être prêt à recevoir à nouveau la Torah à Chavouot.","Baal Shem Tov · Admour HaZaken, Likoutei Torah Emor · Sfat Emet");

m(32,"<p><strong>Behar — L'année sabbatique (shemita)</strong> — Toutes les sept ans, la terre d'Israël se repose. Interdiction de semer, tailler et récolter. Les fruits qui poussent spontanément appartiennent à tous. Après sept cycles de sept ans : le Jubilé (yovel).</p><p><strong>Le Jubilé et la liberté</strong> — L'année du jubilé : les esclaves hébreux sont libérés, les terres vendues reviennent à leurs familles d'origine. « Vous proclamerez la liberté dans tout le pays pour tous ses habitants. »</p><p><strong>Bechukotai — bénédictions et malédictions</strong> — Si Israël suit les lois divines, D-ieu bénira abondamment. Si Israël abandonne la Torah, de terribles châtiments s'abattront. La paracha se termine par l'espoir d'une réconciliation éternelle.","<p><strong>La shemita et la confiance totale en D-ieu</strong> — Laisser la terre en jachère une année entière demande un bitahon absolu. Le Baal Shem Tov : la shemita enseigne que la terre appartient à D-ieu. Nous sommes des gérants temporaires — jamais des propriétaires absolus.</p><p><strong>Dror — la liberté intérieure</strong> — דְּרוֹר (liberté du jubilé) signifie aussi « hirondelle » — oiseau qui ne peut vivre en captivité. L'Admour HaZaken : la vraie liberté est intérieure — se libérer de l'emprise de l'ego et du matérialisme qui enchaîne l'âme.</p><p><strong>La tocheha comme amour paternel</strong> — Le Sfat Emet : les malédictions terribles de la tocheha sont prononcées à voix basse dans la synagogue car elles naissent de l'amour. Un père qui corrige son enfant souffre autant que lui.","Baal Shem Tov · Admour HaZaken, Likoutei Torah Behar · Sfat Emet");

m(34,"<p><strong>Le recensement d'Israël</strong> — D-ieu ordonne de recenser tous les hommes de vingt ans et plus, aptes au combat. Le total est de 603 550. Les Lévites sont recensés séparément — non pour la guerre mais pour le service du Tabernacle.</p><p><strong>L'organisation du camp</strong> — Organisation précise du campement autour du Tabernacle : chaque tribu a sa place assignée, son drapeau et ses chefs. Les Lévites campent immédiatement autour du Tabernacle pour le protéger.</p><p><strong>Les Lévites — la tribu de D-ieu</strong> — Les Lévites sont consacrés au service du Tabernacle en lieu et place des premiers-nés d'Israël. Ils ont 35 ans de service actif (de 30 à 65 ans).","<p><strong>Le désert — état d'esprit idéal</strong> — La Torah est donnée dans le désert — terre de personne, appartenant à tous. Le Baal Shem Tov : pour recevoir la Torah, il faut se vider comme un désert — abandonner les préjugés et l'orgueil. Le désert intérieur est l'état d'âme idéal pour apprendre.</p><p><strong>Chaque homme est un monde entier</strong> — L'Admour HaZaken : pourquoi recenser individuellement chaque homme ? Car chaque âme juive est un monde entier. Qui détruit une âme détruit un monde, qui en sauve une sauve un monde. Le recensement est une célébration de l'unicité de chaque être.</p><p><strong>Les drapeaux — l'unité dans la diversité</strong> — Le Sfat Emet : chaque tribu a son drapeau et sa couleur propres. La diversité au sein de l'unité est un idéal divin. La richesse d'Israël réside dans la complémentarité de ses tribus — chacune porte un aspect différent de la Torah.","Baal Shem Tov · Admour HaZaken · Sfat Emet Bamidbar");

m(35,"<p><strong>Le recensement des Lévites et leurs charges</strong> — Les trois familles lévitiques (Guershon, Kehat, Merari) et leurs charges dans le transport du Tabernacle. Les Kehatites portent les objets les plus saints.</p><p><strong>La bénédiction sacerdotale</strong> — D-ieu transmet à Aaron la triple bénédiction (Birkat Cohanim) : « Que D-ieu te bénisse et te garde, que D-ieu illumine Son visage vers toi, que D-ieu tourne Son visage vers toi et te donne la paix. »</p><p><strong>Les offrandes des princes des tribus</strong> — Chaque prince apporte des offrandes identiques pour l'inauguration de l'autel pendant douze jours consécutifs. La Torah décrit chaque offrande séparément malgré leur identité formelle.","<p><strong>La birkat cohanim — le visage de D-ieu</strong> — « Que D-ieu illumine Son visage vers toi. » Le Baal Shem Tov : le visage de D-ieu est Sa Présence directe dévoilée. Quand D-ieu tourne Son visage vers nous, toute la création rayonne de sens et de beauté.</p><p><strong>Chaque offrande est unique</strong> — Bien que les douze offrandes soient identiques, la Torah les décrit douze fois en détail. L'Admour HaZaken : l'intention et le contexte transforment un acte identique en acte unique. Deux personnes qui font la même chose ne font pas la même chose car chaque âme est différente.</p><p><strong>Nasso — élever la tête</strong> — נָשֹׂא signifie « élever, porter ». Le Sfat Emet : le service divin n'est pas un fardeau mais une élévation. Chaque mitsva accomplie avec joie « élève la tête » — elle grandit l'âme de celui qui la fait.","Baal Shem Tov · Admour HaZaken · Sfat Emet Nasso");

m(36,"<p><strong>L'allumage de la Menora et la consécration des Lévites</strong> — Aaron allume les sept lampes. Les Lévites sont purifiés et consacrés au service. Loi du second Pessa'h (Pessah Cheni) pour ceux qui n'ont pu faire la Pâque au temps prescrit.</p><p><strong>La nuée et les trompettes</strong> — La nuée et le feu guidaient les déplacements. D-ieu ordonne de fabriquer deux trompettes d'argent pour convoquer le peuple et signaler les départs.</p><p><strong>Les plaintes et la révolte</strong> — Le peuple se plaint de la manne et demande de la viande. D-ieu envoie des cailles. Myriam et Aaron parlent contre Moïse. Myriam est frappée de tsaraat pendant sept jours.","<p><strong>Beha'alotcha — faire monter la lumière</strong> — « Quand tu fais monter les lampes. » Le Baal Shem Tov : allumer une lumière c'est faire monter l'étincelle divine de la matière vers sa source. Chaque mitsva accomplie « fait monter » une étincelle vers D-ieu.</p><p><strong>Le Pessah Cheni — une deuxième chance</strong> — D-ieu institue un second Pessa'h pour ceux qui ont manqué le premier. L'Admour HaZaken : le judaïsme ne rejette jamais celui qui a raté l'occasion — il lui offre une deuxième chance. Aucune porte n'est définitivement fermée.</p><p><strong>Myriam et la lachon hara</strong> — Myriam, grande prophétesse, est frappée de tsaraat pour avoir parlé contre Moïse. Le Sfat Emet : si même Myriam est punie, combien plus devons-nous surveiller notre langue. La grandeur spirituelle n'immunise pas contre le péché de la parole.","Baal Shem Tov · Admour HaZaken, Likoutei Torah · Sfat Emet");

m(37,"<p><strong>Les espions envoyés en Canaan</strong> — D-ieu ordonne d'envoyer des explorateurs. Douze espions, un par tribu, reconnaissent Canaan pendant quarante jours. Ils reviennent avec un raisin si lourd que deux hommes peinent à le porter.</p><p><strong>Le mauvais rapport</strong> — Dix espions rapportent que le pays est imprenable : « Nous étions à nos propres yeux comme des sauterelles. » Seuls Calev et Josué soutiennent que D-ieu donnera la victoire. Le peuple pleure et veut retourner en Égypte.</p><p><strong>La punition et le tsitsit</strong> — D-ieu condamne la génération du désert à errer quarante ans. Seuls Calev et Josué entreront en Canaan. La paracha se clôt sur la mitsva du tsitsit.","<p><strong>La faute des espions — doute de soi</strong> — Les espions étaient des grands hommes. Leur faute subtile : ils croyaient en D-ieu mais doutaient d'eux-mêmes. Le Baal Shem Tov : douter de sa propre capacité à accomplir la mission divine est aussi grave que douter de D-ieu lui-même.</p><p><strong>Calev à Hébron — la force des ancêtres</strong> — Calev se recueillit sur les tombes des patriarches à Hébron pour puiser la force de résister. L'Admour HaZaken : la connexion aux ancêtres (zekhout avot) est une source de force spirituelle dans les moments de doute et de pression.</p><p><strong>Le tsitsit — mémoire totale</strong> — Le Sfat Emet : le tsitsit vaut autant que toutes les mitsvot car il les rappelle toutes. L'Exode d'Égypte est mentionné dans le tsitsit pour rappeler que chaque libération extérieure doit s'accompagner d'une libération intérieure.","Baal Shem Tov · Admour HaZaken · Sfat Emet Shelach");

m(38,"<p><strong>La rébellion de Korach</strong> — Korach, Lévite de haute lignée, s'insurge contre Moïse et Aaron avec 250 chefs : « Toute la communauté est sainte ! » Datan et Aviram rejoignent la révolte.</p><p><strong>Le châtiment divin</strong> — La terre s'ouvre et engloutit Korach, Datan et Aviram avec leurs familles. Un feu divin consume les 250 hommes aux encensoirs.</p><p><strong>Le bâton d'Aaron et les prérogatives sacerdotales</strong> — D-ieu confirme le rôle d'Aaron par le miracle de son bâton qui fleurit et produit des amandes. Les dons (teroumot et maassrot) destinés aux cohanim et aux Lévites sont détaillés.","<p><strong>Korach — l'orgueil spiritual</strong> — Korach avait une grande âme et une intelligence remarquable. Sa faute était l'orgueil spirituel : vouloir la sainteté pour lui-même et non pour le service de D-ieu. Le Baal Shem Tov : l'orgueil spiritual est la faute la plus difficile à détecter car elle ressemble à la sainteté.</p><p><strong>Toute la communauté est sainte — juste mais mal conclu</strong> — L'Admour HaZaken : Korach avait raison sur le fond mais tort sur la conclusion. Même si tous sont saints, les structures et hiérarchies permettent à la sainteté de se manifester dans le monde de manière ordonnée.</p><p><strong>La terre qui s'ouvre — descente vers la rédemption</strong> — Le Sfat Emet : Korach descend vivant aux enfers — selon le Midrach, il y chante encore les louanges de D-ieu en attendant sa rédemption finale. Même la faute la plus grave n'est pas sans espoir de réparation.","Baal Shem Tov · Admour HaZaken, Likoutei Torah Korach · Sfat Emet");

m(39,"<p><strong>Chukat — La vache rousse</strong> — Loi de la para adouma (vache rousse) : une vache sans défaut est brûlée hors du camp. Ses cendres mélangées à de l'eau purifient celui qui a touché un mort. C'est le « hok » par excellence — loi incompréhensible à la raison.</p><p><strong>La mort de Myriam et la faute de Moïse</strong> — Myriam meurt. Le puits de Myriam disparaît. Le peuple se plaint. D-ieu dit à Moïse de parler au rocher, mais Moïse le frappe deux fois. D-ieu lui annonce qu'il n'entrera pas en Canaan.</p><p><strong>Balak — Balaam et les bénédictions</strong> — Balak roi de Moab engage le prophète Balaam pour maudire Israël. L'ânesse de Balaam voit l'ange et parle. Chaque fois que Balaam ouvre la bouche, des bénédictions sortent à la place de malédictions.","<p><strong>La para adouma — au-delà de la raison</strong> — La vache rousse purifie l'impur et impurifie le pur. Le Baal Shem Tov : les hokim (lois irrationnelles) révèlent que la Torah vient d'une sagesse supérieure à la raison humaine. Les accepter élève l'âme plus haut que toute compréhension intellectuelle.</p><p><strong>Moïse frappe au lieu de parler</strong> — L'Admour HaZaken : à ce niveau de sainteté, Moïse aurait dû convertir la rigueur en douceur par la parole. Frapper était adapté à un niveau inférieur — mais pas à Moïse en cet instant de révélation.</p><p><strong>Mah tovu ohalekha Yaakov</strong> — « Que tes tentes sont belles, Jacob ! » — La plus grande bénédiction de la Torah vient d'un ennemi. Le Sfat Emet : D-ieu peut faire parler même les bouches malveillantes pour révéler la vérité. La beauté d'Israël s'impose même à ceux qui voudraient la nier.","Baal Shem Tov · Admour HaZaken · Sfat Emet Chukat");

m(41,"<p><strong>Le zèle de Pinchas</strong> — Pinchas tue un prince israélite et une princesse madianite qui péchaient publiquement. Son acte arrête la peste qui avait tué 24 000 personnes. D-ieu lui accorde l'alliance éternelle de la paix.</p><p><strong>Le second recensement et les filles de Tselofhad</strong> — Nouveau recensement après la peste. Les filles de Tselofhad demandent leur part d'héritage en l'absence de frères. D-ieu leur accorde. Josué est désigné comme successeur de Moïse.</p><p><strong>Les sacrifices supplémentaires</strong> — Calendrier complet des sacrifices supplémentaires (moussafim) pour chaque Chabbat, Roch Hodesh, et chaque fête de l'année.","<p><strong>L'alliance de paix donnée au zélé</strong> — Pinchas agit avec violence mais reçoit une alliance de paix. Le Baal Shem Tov : le vrai zèle pour D-ieu finit toujours par la paix car il est motivé par l'amour et non par la haine. Seule la violence motivée par l'amour pur peut apporter une paix durable.</p><p><strong>Pinchas-Eliyahou — présent dans chaque génération</strong> — La tradition identifie Pinchas à Eliyahou le prophète. L'Admour HaZaken : cette âme traverse les générations pour être présente à chaque moment de crise d'Israël — au Séder de Pessa'h, à la brit mila, à la fin des temps.</p><p><strong>Les filles de Tselofhad — l'amour de la terre</strong> — Le Sfat Emet : ces cinq femmes aimaient tellement la terre d'Israël qu'elles réclamèrent leur part. Leur amour fut récompensé. L'amour de la terre d'Israël est une dimension spirituelle à part entière.","Baal Shem Tov · Admour HaZaken · Sfat Emet Pinchas");

m(42,"<p><strong>Matot — Les vœux et la guerre contre Midian</strong> — Lois des vœux et serments : le père peut annuler les vœux de sa fille, le mari ceux de sa femme. Guerre totale contre Midian — victoire, partage du butin entre les combattants, la communauté et le Tabernacle.</p><p><strong>Les tribus de Gad et Ruben</strong> — Ces tribus demandent à s'installer en Transjordanie pour leurs nombreux troupeaux. Moïse accepte à condition qu'ils combattent avec leurs frères pour conquérir Canaan.</p><p><strong>Massei — Les 42 étapes du désert</strong> — Liste complète des 42 étapes du voyage. Lois de la répartition de la terre de Canaan. Les villes de refuge pour les meurtriers involontaires. Lois des mariages entre tribus.","<p><strong>Les 42 étapes — un voyage intérieur</strong> — Le Baal Shem Tov : les 42 étapes correspondent aux 42 lettres du Nom divin. Chaque étape du voyage dans le désert est une étape du voyage de l'âme vers D-ieu. Nos propres « déserts » de vie sont des étapes nécessaires de croissance spirituelle.</p><p><strong>Les vœux — la puissance de la parole</strong> — L'Admour HaZaken : l'homme est défini par sa parole — ce qui le distingue de l'animal. Les lois des vœux enseignent que chaque parole prononcée engage l'âme entière. Parler est un acte créateur de premier ordre.</p><p><strong>Les villes de refuge — la miséricorde pour l'involontaire</strong> — Le Sfat Emet : les villes de refuge protègent le meurtrier involontaire. Elles symbolisent la miséricorde divine — même pour celui qui a causé la mort par accident, il existe un espace de protection et de possible rédemption.","Baal Shem Tov · Admour HaZaken · Sfat Emet Matot-Massei");

m(44,"<p><strong>Le discours d'adieu de Moïse</strong> — Moïse, à 120 ans, commence son dernier grand discours dans les plaines de Moab. Il rappelle les événements du désert : l'organisation des juges, l'envoi des espions, les guerres contre Sihon et Og.</p><p><strong>L'appel à entrer en Canaan</strong> — Moïse rappelle que D-ieu lui a refusé l'entrée en Canaan à cause de la faute au rocher. Il désigne Josué devant le peuple entier. Tout le Deutéronome est le testament spirituel de Moïse.</p><p><strong>Le ton du reproche avec amour</strong> — Moïse reproche au peuple ses fautes passées avec douceur, utilisant des allusions et des noms de lieux pour préserver leur honneur tout en leur transmettant les leçons essentielles.","<p><strong>Moïse reprend avec amour et discrétion</strong> — Moïse mentionne les fautes à travers des noms de lieux sans les nommer explicitement. Le Baal Shem Tov : le vrai reproche se fait avec amour et discrétion. Blesser quelqu'un publiquement pour son bien n'est pas du bien — c'est de la cruauté.</p><p><strong>Eleh hadevarim — peh Moshé</strong> — Le Zohar : le livre Devarim est la « bouche de Moïse ». Pour la première fois, un homme parle de sa propre voix dans la Torah. L'Admour HaZaken : la voix de Moïse est la voix de D-ieu habillée en voix humaine — le plus grand miracle.</p><p><strong>Les 120 ans de Moïse — les yeux non obscurcis</strong> — Le Sfat Emet : Moïse a 120 ans et « ses yeux ne s'étaient pas obscurcis ». La vieillesse du corps ne diminue pas la lumière de l'âme. L'étude et le service de D-ieu préservent la jeunesse intérieure.","Baal Shem Tov · Zohar · Sfat Emet Devarim 5635");

m(45,"<p><strong>L'intercession de Moïse et le refus divin</strong> — Moïse rappelle avoir supplié D-ieu quarante jours et nuits après le veau d'or. D-ieu lui a pardonné le peuple mais lui-même n'entrera pas en Canaan. D-ieu lui permet de voir le pays depuis le mont Pisgah.</p><p><strong>Le Chema Israël</strong> — « Écoute Israël, D-ieu est notre D-ieu, D-ieu est Un. » Puis le « Véahavta » : aimer D-ieu de tout son cœur, de toute son âme, de tout son être. Les mitsvot des tefilines et de la mezouza découlent de ces versets.</p><p><strong>Avertissements contre l'idolâtrie</strong> — Moïse met en garde contre la séduction de l'idolâtrie dans la prospérité de Canaan. Il rappelle les Dix Commandements avec quelques variations significatives par rapport à Shemot.","<p><strong>Va'etchanan — la prière la plus intense</strong> — Moïse a supplié D-ieu 515 fois (valeur numérique de va'etchanan). Le Baal Shem Tov : la prière du cœur brisé perce tous les cieux. Même quand la réponse est « non », la prière elle-même est une connexion avec D-ieu qui n'est jamais perdue.</p><p><strong>Le Chema — l'Unité divine absolue</strong> — L'Admour HaZaken (Tanya ch.33) : « D-ieu est Un » signifie que D-ieu est la seule réalité véritable. Tout ce qui existe n'est qu'une expression de Son Être infini. La méditation quotidienne sur cette unité est le cœur du service hassidique.</p><p><strong>Bechol nafshecha — même au prix de la vie</strong> — Le Sfat Emet : « de toute ton âme » signifie même si D-ieu prend ton âme. Les martyrs d'Israël qui mouraient en prononçant le Chema exprimaient cette dimension ultime et absolue de l'amour divin.","Baal Shem Tov · Tanya ch.33 · Sfat Emet Va'etchanan");

m(46,"<p><strong>La récompense de l'obéissance</strong> — Si Israël observe les commandements, D-ieu repoussera les nations. Moïse rappelle les miracles de l'Exode et les épreuves du désert — tout cela pour éduquer Israël à la confiance absolue en D-ieu.</p><p><strong>La manne comme leçon centrale</strong> — « L'homme ne vit pas seulement de pain mais de tout ce qui sort de la bouche de D-ieu. » La manne enseignait la dépendance totale envers D-ieu et la priorité absolue du spirituel sur le matériel.</p><p><strong>La terre et la birkat hamazon</strong> — Description de la beauté de la terre de Canaan. Mise en garde contre l'oubli de D-ieu dans la prospérité. « Et tu mangeras, tu seras rassasié et tu béniras D-ieu. » C'est l'origine de la bénédiction après les repas.","<p><strong>Ekev — le talon de la récompense</strong> — עֵקֶב signifie « talon, récompense ». Le Baal Shem Tov : les mitsvot accomplies avec les talons — par habitude, sans enthousiasme particulier — ont aussi leur récompense. Même un service divin imparfait a une valeur infinie.</p><p><strong>L'homme ne vit pas de pain seul</strong> — L'Admour HaZaken : cette phrase est le fondement de toute spiritualité. Le pain nourrit le corps, la Torah nourrit l'âme — et l'âme est la dimension fondamentale de l'être humain.</p><p><strong>La prospérité comme test difficile</strong> — Le Sfat Emet : « souviens-toi que c'est D-ieu qui te donne la force ». La prospérité est le test le plus difficile. L'adversité nous rapproche naturellement de D-ieu — la réussite peut nous en éloigner insidieusement.","Baal Shem Tov · Admour HaZaken, Tanya ch.4 · Sfat Emet Ekev");

m(47,"<p><strong>La bénédiction et la malédiction</strong> — Moïse pose devant Israël le choix fondamental : bénédiction si vous obéissez, malédiction si vous désobéissez. Les deux seront proclamées sur les monts Guérizim et Eval en Canaan.</p><p><strong>L'unification du culte</strong> — Interdiction des hauts-lieux cananéens. Tout sacrifice doit être offert au lieu unique que D-ieu choisira (Jérusalem). Lois des animaux que l'on peut consommer hors du sanctuaire.</p><p><strong>Les faux prophètes et les lois sociales</strong> — Mise en garde contre les faux prophètes et les séducteurs. Les villes idolâtres. La dîme, l'année de la remise des dettes, la libération des esclaves hébreux, les trois fêtes de pèlerinage.","<p><strong>Ré'eh — vois aujourd'hui !</strong> — « Vois — je mets devant toi aujourd'hui la bénédiction et la malédiction. » Le Baal Shem Tov : « aujourd'hui » — la Torah est toujours actuelle, jamais passée. Et « vois » au singulier à tout Israël — chaque individu est responsable du tout.</p><p><strong>Le lieu que D-ieu choisira</strong> — L'Admour HaZaken : Jérusalem n'est jamais nommée dans le Deutéronome. La sainteté ne se limite pas à un lieu fixe — D-ieu se révèle là où l'homme Le cherche sincèrement, avec tout son cœur.</p><p><strong>L'esclave libéré avec générosité</strong> — Le Sfat Emet : la Torah commande de libérer l'esclave avec des cadeaux généreux, en souvenir de notre propre servitude en Égypte. Le souvenir de la souffrance doit nous rendre généreux envers ceux qui souffrent.","Baal Shem Tov · Admour HaZaken · Sfat Emet Re'eh");

m(48,"<p><strong>Les juges et les rois</strong> — Des juges et officiers sont institués dans toutes les villes. Lois du roi : il ne doit pas multiplier les chevaux, les femmes ni l'or. Il doit écrire pour lui-même un rouleau de la Torah et le lire tous les jours.</p><p><strong>Les cohanim, les Lévites et les prophètes</strong> — Part des cohanim dans les sacrifices. Lois du vrai et du faux prophète — le vrai prophète parle au nom de D-ieu et ses prophéties se réalisent fidèlement.</p><p><strong>Les lois de la guerre</strong> — Avant la bataille, le prêtre harangue le peuple et exempte ceux qui ont planté une vigne, fiancé une femme ou construit une maison. Protection des arbres fruitiers lors des sièges.","<p><strong>Tsedek tsedek tirdof — la justice deux fois</strong> — « Justice, justice tu poursuivras. » Le Baal Shem Tov : la répétition enseigne que la justice doit être poursuivie même par des moyens justes. La fin ne justifie pas les moyens — même pour la justice la plus noble.</p><p><strong>Le roi qui lit la Torah chaque jour</strong> — L'Admour HaZaken : le roi doit toujours avoir la Torah avec lui. Le pouvoir sans la Torah corrompt inévitablement. Le leadership véritable est un service total — pas une domination.</p><p><strong>L'arbre comme métaphore de l'homme</strong> — Le Sfat Emet : « car l'homme est l'arbre des champs ». Interdire de couper des arbres fruitiers lors d'un siège enseigne le respect de la vie. Même en guerre, la sensibilité à la création doit être préservée.","Baal Shem Tov · Admour HaZaken · Sfat Emet Shoftim");

m(49,"<p><strong>Les lois personnelles et familiales</strong> — Lois de la femme prise en captivité. Droit du premier-né même de la femme moins aimée. Le fils rebelle et indiscipliné jugé par le tribunal.</p><p><strong>Les lois sociales et environnementales</strong> — Obligation de rendre les biens perdus. Protection de la mère oiseau. Parapet obligatoire sur les toits. Interdiction des mélanges (kilaïm). Poids et mesures justes.</p><p><strong>Lois de pureté et de famille</strong> — Lois sur la diffamation d'une femme, l'adultère, le viol. La loi du lévirat (yibum). Cette paracha contient 74 des 613 commandements — la plus dense de la Torah.","<p><strong>74 mitsvot dans une paracha</strong> — Ki Tetze contient 74 des 613 commandements. Le Baal Shem Tov : la Torah est dans les détails du quotidien. La sainteté n'est pas réservée aux moments rares — elle habite chaque acte ordinaire de la vie.</p><p><strong>La mère oiseau — la compassion universelle</strong> — L'Admour HaZaken : la récompense de la mère oiseau est « de longs jours » — même récompense qu'honorer ses parents. La compassion pour un animal et la compassion pour ses parents sont au même niveau spirituel.</p><p><strong>Poids et mesures justes — le bitahon en action</strong> — Le Sfat Emet : celui qui utilise de faux poids nie implicitement la Providence divine — il croit devoir tricher pour survivre. La confiance totale en D-ieu rend l'honnêteté naturelle et joyeuse.","Baal Shem Tov · Admour HaZaken · Sfat Emet Ki Tetze");

m(50,"<p><strong>Les prémices et la déclaration historique</strong> — En entrant en Canaan, chaque Israélite apporte ses prémices au Temple et récite : « Mon père était un Araméen errant... » — résumé de toute l'histoire d'Israël depuis Jacob jusqu'à l'Exode.</p><p><strong>Le renouvellement de l'alliance</strong> — Moïse et les anciens demandent au peuple d'observer toutes les lois. L'alliance est confirmée solennellement sur les monts Guérizim et Eval.</p><p><strong>La tocheha et l'espoir</strong> — Description des bénédictions et des malédictions terribles. Mais la paracha se termine par l'espoir : D-ieu n'oubliera jamais Son peuple et l'alliance reste éternelle.","<p><strong>Arami oved avi — gratitude et mémoire</strong> — « Mon père était un Araméen errant. » Le Baal Shem Tov : la première prière des prémices commence par l'humilité et la mémoire de la souffrance. La gratitude authentique naît du souvenir de ce que l'on a traversé.</p><p><strong>La tocheha — avertissement d'amour paternel</strong> — L'Admour HaZaken : les malédictions sont récitées rapidement et à voix basse dans la synagogue. Elles viennent de l'amour infini — un père qui avertit son enfant bien-aimé des conséquences de ses actes.</p><p><strong>La joie comme protection</strong> — Le Sfat Emet : au cœur des malédictions se trouve « parce que tu n'as pas servi D-ieu avec joie ». La source de toute souffrance est l'absence de joie dans le service divin. Servir D-ieu avec joie est la plus grande protection.","Baal Shem Tov · Iggeret HaTéchouva · Sfat Emet Ki Tavo");

m(51,"<p><strong>Nitzavim — Vous vous tenez debout</strong> — Moïse convoque tout Israël devant D-ieu : grands et petits, hommes et femmes, étrangers, bûcherons et porteurs d'eau. Tous — présents et générations futures — entrent dans l'alliance divine.</p><p><strong>La Torah est très proche de toi</strong> — « Cette mitsva n'est pas au ciel... ni au-delà de la mer... elle est très proche de toi, dans ta bouche et dans ton cœur. » La Torah est accessible à chacun.</p><p><strong>Vayeilech — Le dernier jour de Moïse</strong> — Moïse, à 120 ans, va vers son peuple une dernière fois. Il annonce que Josué le conduira. Il écrit la Torah entière et la confie aux Lévites. D-ieu prédit que le peuple désobéira mais l'alliance reste éternelle.","<p><strong>Atem nitzavim — vous tenez debout après tout</strong> — Après la tocheha terrible, le peuple tient encore debout. Le Baal Shem Tov : la téchouva redresse celui qui était brisé. Quelle que soit la profondeur de la chute, l'âme juive peut toujours se relever.</p><p><strong>La Torah dans la bouche et dans le cœur</strong> — L'Admour HaZaken : « dans ta bouche » — la parole de Torah qui s'articule ; « dans ton cœur » — la méditation de Torah qui intériorise. Ces deux niveaux se complètent : la parole ancre la pensée, la pensée élève la parole.</p><p><strong>La téchouva — un retour à soi-même</strong> — Le Sfat Emet : « et tu reviendras vers D-ieu » — la téchouva est un retour, non une transformation. L'âme retrouve ce qu'elle a toujours été. On ne devient pas nouveau — on redevient soi-même, son moi authentique et profond.","Baal Shem Tov · Admour HaZaken, Tanya ch.29 · Sfat Emet Nitzavim");

m(52,"<p><strong>Le dernier jour de Moïse</strong> — Moïse, à 120 ans, va vers son peuple une dernière fois. Il annonce qu'il ne les conduira pas en Canaan. Josué est officiellement investi comme successeur devant tout le peuple assemblé.</p><p><strong>La loi transmise au peuple</strong> — Moïse écrit la Torah et la confie aux prêtres lévites et aux anciens d'Israël. Il ordonne la lecture publique de la Torah tous les sept ans à Souccot (Hakhel) — tout le peuple entendra.</p><p><strong>La prophétie de la désobéissance</strong> — D-ieu dit à Moïse que le peuple l'abandonnera après sa mort. Il commande d'écrire le chant de Haazinou comme témoignage éternel.","<p><strong>Vayeilech — il alla jusqu'au bout</strong> — Moïse va vers le peuple le jour même de sa mort. Le Baal Shem Tov : le service divin ne s'arrête jamais — même face à la mort. La grandeur de Moïse est de continuer à donner et à enseigner jusqu'à son dernier souffle.</p><p><strong>Hakhel — le rassemblement sacré</strong> — Tous les sept ans, tout le peuple se rassemble pour entendre la Torah. L'Admour HaZaken : le rassemblement collectif crée une conscience spirituelle supérieure à la somme des individus. L'âme collective d'Israël est plus grande que chaque âme prise séparément.</p><p><strong>La Torah comme témoin d'amour</strong> — Le Sfat Emet : D-ieu sait que le peuple pèchera — et pourtant Il lui confie la Torah. C'est l'acte de confiance le plus profond : malgré tout ce qu'Il sait, D-ieu continue de croire en l'homme et en sa capacité de retour.","Baal Shem Tov · Admour HaZaken, Likoutei Torah · Sfat Emet");

m(53,"<p><strong>Le chant de Moïse — Haazinou</strong> — Poème prophétique de 43 versets décrivant l'histoire entière d'Israël : l'élection divine, la prospérité, la corruption, le châtiment, et la délivrance finale.</p><p><strong>D-ieu comme Rocher</strong> — « Le Rocher — parfaites sont Ses œuvres, car toutes Ses voies sont justice. » D-ieu est comparé à un rocher : stable, permanent, fiable. Ses jugements sont toujours justes même quand ils nous semblent incompréhensibles.</p><p><strong>La délivrance finale</strong> — Le chant se termine sur l'espérance : « Réjouissez-vous, nations, avec Son peuple, car Il vengera le sang de Ses serviteurs. » La justice divine sera accomplie et le peuple sera délivré.","<p><strong>Haazinou — témoignage cosmique</strong> — « Prêtez l'oreille, ô cieux. » Le Baal Shem Tov : Moïse prend les cieux à témoin car le message dépasse le temps. La Torah de Moïse résonne dans toutes les dimensions de la création.</p><p><strong>Le Rocher dans l'adversité</strong> — L'Admour HaZaken : D-ieu est appelé « Rocher » dans ce chant de souffrance. Dans les moments les plus difficiles, D-ieu est le plus présent et le plus stable — comme un rocher qui ne cède jamais sous la pression.</p><p><strong>Comme l'aigle réveille son nid</strong> — « Ke'nesher ya'ir kino. » Le Sfat Emet : l'aigle réveille ses aiglons en battant ses ailes au-dessus d'eux — sans les toucher, uniquement par le courant d'air de sa présence. Ainsi D-ieu guide Israël — pas par la force mais par Sa présence et Sa lumière.","Baal Shem Tov · Admour HaZaken · Sfat Emet Haazinu");

m(54,"<p><strong>La bénédiction de chaque tribu</strong> — Moïse bénit chacune des douze tribus avec une prophétie personnelle révélant la mission unique et la destinée particulière de chaque famille d'Israël.</p><p><strong>La mort de Moïse sur le mont Nébo</strong> — Moïse monte sur le mont Nébo. D-ieu lui montre toute la terre de Canaan. Moïse meurt selon la parole de D-ieu à 120 ans. « Ses yeux ne s'étaient pas obscurcis et sa vigueur n'avait pas fléchi. » D-ieu l'enterre Lui-même.</p><p><strong>L'éloge éternel de Moïse</strong> — « Il ne se leva plus en Israël un prophète comme Moïse, que D-ieu connaissait face à face. » La Torah se clôt sur le portrait du plus grand prophète — celui qui a reçu et transmis la Torah pour l'éternité.","<p><strong>D-ieu enterre Moïse Lui-même</strong> — D-ieu cache la tombe de Moïse — « nul ne connaît sa sépulture jusqu'à ce jour ». Le Baal Shem Tov : D-ieu cache la tombe pour que l'on vénère non le lieu mais l'enseignement. La Torah de Moïse est son véritable et éternel monument.</p><p><strong>Ses yeux n'étaient pas obscurcis</strong> — À 120 ans, Moïse voyait encore avec une clarté parfaite. L'Admour HaZaken : l'étude de la Torah et le service de D-ieu préservent les facultés spirituelles et même physiques. La lumière de l'âme entretient la lumière du corps.</p><p><strong>Vezot HaBerakha — et voici la bénédiction</strong> — Le Sfat Emet : la Torah se termine par une bénédiction et recommence par Bereshit (au commencement). La Torah est un cercle parfait sans fin. Chaque fin est un nouveau commencement — la Torah est éternellement jeune.","Baal Shem Tov · Admour HaZaken, Likoutei Torah · Sfat Emet Vezot HaBerakha");

function hebLeap(y){return((7*y)+1)%19<7;}
function hebMonthsInYear(y){return hebLeap(y)?13:12;}
function hebElapsed(y){var m=Math.floor((235*y-234)/19);var p=12084+13753*m;var d=m*29+Math.floor(p/25920);if((3*(d+1))%7<3)d++;return d;}
function hebDIY(y){return hebElapsed(y+1)-hebElapsed(y);}
function hebDIM(m,y){switch(m){case 1:case 3:case 5:case 7:case 11:return 30;case 13:return 29;case 6:return hebLeap(y)?30:29;case 8:return(hebDIY(y)%10)===5?30:29;case 9:return(hebDIY(y)%10)===3?29:30;default:return 29;}}
function gregToJD(d,m,y){m=m+1;return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d-1524.5-(y>1582||(y===1582&&m>10)||(y===1582&&m===10&&d>=15)?Math.floor(y/100)-Math.floor(y/400)-2:0);}
function jdToHeb(jd){jd=Math.floor(jd)+0.5;var yr=Math.floor((jd-347997)/365.25)+1;while(hebElapsed(yr+1)<=jd-347997)yr++;while(hebElapsed(yr)>jd-347997)yr--;var st=hebElapsed(yr)+347997;var mo=1;var nm=hebMonthsInYear(yr);while(mo<nm&&st+hebDIM(mo,yr)<=jd){st+=hebDIM(mo,yr);mo++;}return{d:jd-st+1,m:mo,y:yr};}
function g2h(d,m,y){return jdToHeb(gregToJD(d,m,y));}
function hmName(m,y,heb){var lp=hebLeap(y);if(heb)return lp?HMLH[m-1]:HMH[m-1];return lp?HML[m-1]:HM[m-1];}
function hDay(d){return HNUM[d]||String(d);}
function hYear(y){var mod=y%1000;var h=Math.floor(mod/100);var t=Math.floor((mod%100)/10);var u=mod%10;var s=HUNDS[h];if(t===1&&u===5)s+="טו";else if(t===1&&u===6)s+="טז";else s+=TENS[t]+UNITS[u];if(s.length===1)s+="׳";else s=s.slice(0,-1)+"״"+s.slice(-1);return s;}
function fmtHeb(h){return hDay(h.d)+" "+hmName(h.m,h.y,true)+" "+hYear(h.y);}
function fmtHebLat(h){return h.d+" "+hmName(h.m,h.y,false)+" "+h.y;}

function initLoc(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(function(p){uLat=p.coords.latitude;uLng=p.coords.longitude;fetch('https://nominatim.openstreetmap.org/reverse?lat='+uLat+'&lon='+uLng+'&format=json').then(function(r){return r.json();}).then(function(d){uCity=d.address.city||d.address.town||d.address.village||"votre ville";buildHome();}).catch(function(){buildHome();});},function(){});}
function sunCalc(date,lat,lng,rise){var J=(date.getTime()/86400000)+2440587.5;var n=Math.ceil(J-2451545.0+0.0008);var Js=n-lng/360;var M=(357.5291+0.98560028*Js)%360,Mr=M*Math.PI/180;var C=1.9148*Math.sin(Mr)+0.0200*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);var lam=(M+C+180+102.9372)%360,lr=lam*Math.PI/180;var Jt=2451545.0+Js+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*lr);var decl=Math.asin(Math.sin(lr)*Math.sin(23.4397*Math.PI/180));var latr=lat*Math.PI/180;var cosH=(Math.sin(-0.8333*Math.PI/180)-Math.sin(latr)*Math.sin(decl))/(Math.cos(latr)*Math.cos(decl));if(cosH<-1||cosH>1)return null;var H=Math.acos(cosH)*180/Math.PI;var Jss=Jt+(rise?-H/360:H/360);return new Date((Jss-2440587.5)*86400000);}
function fmtT(d){var h=d.getHours(),m=d.getMinutes();return(h<10?'0':'')+h+'h'+(m<10?'0':'')+m;}
function getShabbat(fri){var sf=sunCalc(fri,uLat,uLng,false);var sat=new Date(fri.getTime()+86400000);var ss=sunCalc(sat,uLat,uLng,false);if(!sf||!ss)return null;return{candle:fmtT(new Date(sf.getTime()-18*60000)),havdala:fmtT(new Date(ss.getTime()+42*60000))};}

function getHomeBanners(){
  var t=new Date(),gd=t.getDate(),gm=t.getMonth(),gy=t.getFullYear();
  var html='';
  getTodayEv().forEach(function(ev){html+='<div class="bday-banner">🎂 Aujourd\'hui : <strong>'+ev.name+'</strong></div>';});
  getFetesOn(gd,gm,gy).forEach(function(f){
    var dn=Math.floor((t-new Date(f.y,f.m,f.d))/86400000)+1;
    var suf=f.days>1?' ('+['1er','2e','3e','4e','5e','6e','7e','8e'][dn-1]+' jour)':'';
    html+='<div class="fete-banner"><div class="fn">'+f.e+' '+f.name+suf+'</div><div class="fh">'+f.heb+'</div></div>';
  });
  var dow=t.getDay();
  if(dow>=4||dow===6){
    var fri=new Date(t);
    if(dow===6)fri=new Date(t.getTime()-86400000);
    else if(dow<5)fri=new Date(t.getTime()+86400000);
    fri.setHours(12,0,0,0);
    var sh=getShabbat(fri);
    if(sh){
      var sat=new Date(fri.getTime()+86400000);
      html+='<div class="shabbat-banner"><div class="shabbat-icon">🕯</div><div class="shabbat-info"><div class="shabbat-title">Chabbat · '+fri.getDate()+' '+FR_M[fri.getMonth()]+' – '+sat.getDate()+' '+FR_M[sat.getMonth()]+' · '+uCity+'</div><div class="shabbat-times">Allumage <span>vendredi</span> '+sh.candle+' &nbsp;|&nbsp; Havdala <span>samedi</span> '+sh.havdala+'</div></div></div>';
    }
  }
  return html;
}
