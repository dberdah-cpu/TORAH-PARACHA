  ['Di','Lu','Ma','Me','Je','Ve','Sa'].forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});
  html+='</div>';
  var day=1;
  for(var w=0;w<6;w++){
    if(day>dim)break;
    html+='<div class="cal-week">';
    for(var dow=0;dow<7;dow++){
      var cd=(w===0&&dow<fd)?0:day;
      if(w>0&&day>dim)cd=0;
      if(cd===0){html+='<div class="cal-day empty"></div>';}
      else{
        var isT=(calY+'-'+(calM+1)+'-'+cd)===todStr;
        var hd=g2h(cd,calM,calY);
        var evs=getEvOnDay(cd,calM,calY,hd);
        var fts=getFetesOn(cd,calM,calY);
        var cls='cal-day'+(isT?' today':'')+(evs.length||fts.length?' has-event':'');
        html+='<div class="'+cls+'" onclick="calDayClick('+cd+')">'
             +'<span class="cal-gday">'+cd+'</span>'
             +'<span class="cal-hday">'+hDay(hd.d)+'</span>'
             +(fts.length?'<div style="font-size:10px;line-height:1">'+fts[0].e+'</div>':'')
             +(evs.length?'<div class="cal-edot"></div>':'')
             +'</div>';
        day++;
      }
    }
    html+='</div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
}

var HY_CACHE={};  // key = heb date string
var SF_CACHE={};  // key = day-of-year number

// Sefer HaMitsvot de Rambam — cycle de 365 jours
// Le cycle 5786 commence le 20 septembre 2025
// Référence vérifiée : 19 avril 2026 = mitsva positive n°212
var SEFER_CYCLE_START = new Date(2025, 8, 20); // 20 sept 2025 (mois 8 = septembre, 0-based)

function getDayOfSeferCycle(gregDate){
  var msPerDay = 86400000;
  var startMs = new Date(SEFER_CYCLE_START.getFullYear(), SEFER_CYCLE_START.getMonth(), SEFER_CYCLE_START.getDate()).getTime();
  var todayMs = new Date(gregDate.getFullYear(), gregDate.getMonth(), gregDate.getDate()).getTime();
  var day = Math.floor((todayMs - startMs) / msPerDay) + 1;
  // Cycle de 365 jours — boucler si besoin
  day = ((day - 1) % 365) + 1;
  if(day <= 0) day += 365;
  return day;
}

function callClaude(prompt, cb){
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':'ignored','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:1200,
      system:'Tu es un érudit hassidique. Réponds UNIQUEMENT en JSON valide sans backticks ni markdown.',
      messages:[{role:'user',content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var raw=(d.content||[]).find(function(b){return b.type==='text';});
    var txt=raw?raw.text:'{}';
    cb(null, JSON.parse(txt.replace(/```json|```/g,'').trim()));
  })
  .catch(function(e){cb(e,null);});
}

  if(HY_CACHE[key]){renderHayomYom(HY_CACHE[key]);return;}

    +'Format JSON: {"heb":"texte hébreu original du Hayom Yom de ce jour","fr":"traduction française complète et fidèle","commentaire":"explication hassidique approfondie en 2-3 paragraphes HTML avec <p>","source":"source exacte (ex: Hayom Yom, 2 Iyar)"}';
  callClaude(prompt, function(err,data){
    if(err||!data){document.getElementById('hy-content').innerHTML='<div class="loading-txt">Connexion requise pour charger le Hayom Yom.</div>';return;}
    HY_CACHE[key]=data;
    renderHayomYom(data);

}

  document.getElementById('view-home').style.display='none';

  var t=new Date();
  var hd=g2h(t.getDate(),t.getMonth(),t.getFullYear());
  var dayNum=getDayOfSeferCycle(t);
  var key=String(dayNum);
  document.getElementById('sf-date').textContent=fmtHeb(hd)+' · Jour '+dayNum+' du cycle annuel';
  if(SF_CACHE[key]){renderSefer(SF_CACHE[key]);return;}
  // Selon le cycle Rambam : jours 1-365 correspondent aux mitsvot dans l'ordre officiel
  // Le numéro de mitsva positive = dayNum (pour les 248 premiers jours)
  // Pour les jours 249-365 : mitsvot négatives uniquement
  var prompt='Selon le cycle quotidien du Sefer HaMitsvot du Rambam, le jour '+dayNum+' du cycle annuel (qui correspond au '+t.getDate()+'/'+('0'+(t.getMonth()+1)).slice(-2)+'/'+t.getFullYear()+'), '
    +'fournis exactement la ou les mitsvot étudiées ce jour. '
    +'Format JSON strict: {"pos":{"num":"numéro exact","titre":"nom français","heb":"nom et source hébraïque","texte":"explication approfondie HTML 2 paragraphes <p>","source":"Rambam, Sefer HaMitsvot, Mitsva X"},"neg":{"num":"numéro exact ou null si pas de mitsva négative ce jour","titre":"nom français","heb":"nom hébraïque","texte":"explication HTML 2 paragraphes <p>","source":"référence"}} '
    +'Si ce jour n\'a qu\'une seule mitsva, mets null pour l\'autre.';
  callClaude(prompt, function(err,data){
    if(err||!data){document.getElementById('sf-content').innerHTML='<div class="loading-txt">Connexion requise pour charger le Sefer HaMitsvot.</div>';return;}
    SF_CACHE[key]=data;
    renderSefer(data);
  });
}

function getVerset(hd){
  if(!hd||!VERSETS||!VERSETS.length) return VERSETS[0];
  var idx=((hd.d||1) + (hd.m||1)*3) % VERSETS.length;
  return VERSETS[idx]||VERSETS[0];
}

var HNS=["","א","ב","ג","ד","ה","ו","ז","ח","ט","י","יא","יב","יג","יד","טו","טז","יז","יח","יט","כ","כא","כב","כג","כד","כה","כו","כז","כח","כט","ל","לא","לב","לג","לד","לה","לו","לז","לח","לט","מ","מא","מב","מג","מד","מה","מו","מז","מח","מט","נ","נא","נב","נג","נד","נה","נו","נז","נח","נט","ס"];

  if(parts.length===1){fetchSef(parts[0],function(v){renderV(v);});}
  else{var all=[],done=0;parts.forEach(function(ref,i){fetchSef(ref,function(v){all[i]=v;done++;if(done===parts.length){var c=[];all.forEach(function(a){c=c.concat(a);});renderV(c);}});});}

function fetchSef(ref,cb){fetch('https://www.sefaria.org/api/texts/'+encodeURIComponent(ref)+'?lang=he&context=0&pad=0').then(function(r){return r.json();}).then(function(d){var v=[];if(Array.isArray(d.he)){if(typeof d.he[0]==='string')v=d.he;else if(Array.isArray(d.he[0]))d.he.forEach(function(ch){ch.forEach(function(x){v.push(x);});});}cb(v);}).catch(function(){cb([]);});}
function renderV(verses){
  if(!verses.length){document.getElementById('d-verses').innerHTML='<div class="loading-txt">Texte non disponible. Consultez les onglets Résumé et Commentaire.</div>';return;}
  var html='',n=1;
  for(var i=0;i<verses.length;i++){var v=verses[i];if(!v||v==='')continue;v=v.replace(/<[^>]+>/g,'');html+='<span class="vrow"><span class="vn">'+toHN(n)+'</span>'+v+'</span>';n++;}
  document.getElementById('d-verses').innerHTML=html;
}
